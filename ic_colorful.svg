<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     width="512" 
     height="512" 
     viewBox="-10 -10 128 128">
    
    <!-- 透明背景 -->
    <rect x="-10" y="-10" width="128" height="128" fill="none"/>
    
    <!-- 放大前景图 (从0.7放大到1.15倍) -->
    <g transform="scale(1.15) translate(-8.1, -8.1)">
        
        <!-- 左上角方框（带圆角）- 蓝色 -->
        <rect x="30" y="30" width="18" height="18" rx="3" ry="3"
              fill="none" 
              stroke="#2196F3" 
              stroke-width="6" 
              stroke-linecap="round" 
              stroke-linejoin="round"/>
        
        <!-- 右上角方框（带圆角）- 橙色 -->
        <rect x="60" y="30" width="18" height="18" rx="3" ry="3"
              fill="none" 
              stroke="#FF9800" 
              stroke-width="6" 
              stroke-linecap="round" 
              stroke-linejoin="round"/>
        
        <!-- 左下角方框（带圆角）- 紫色 -->
        <rect x="30" y="60" width="18" height="18" rx="3" ry="3"
              fill="none" 
              stroke="#9C27B0" 
              stroke-width="6" 
              stroke-linecap="round" 
              stroke-linejoin="round"/>
        
        <!-- 右下角竖线组（扫描线效果）- 多彩 -->
        <line x1="60" y1="60" x2="60" y2="78"
              stroke="#4CAF50" 
              stroke-width="4" 
              stroke-linecap="round"/>
        
        <line x1="69" y1="60" x2="69" y2="78"
              stroke="#F44336" 
              stroke-width="4" 
              stroke-linecap="round"/>
        
        <line x1="78" y1="60" x2="78" y2="78"
              stroke="#00BCD4" 
              stroke-width="4" 
              stroke-linecap="round"/>
    </g>
</svg>
