name: Release Build

on:
  push:
    tags:
      - 'v*'
      # 排除预发布标签；预发布请使用 pre-release.yml 触发
      - '!v*-beta*'
      - '!v*-rc*'
      - '!v*-alpha*'
      - '!v*-pre*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release title'
        required: true
        type: string
        default: 'Release'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create keystore file
        run: |
          echo "${{ secrets.SIGN_KEY_STORE_B64 }}" | base64 -d > sign_key
          ls -lh sign_key
          file sign_key
      
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/sign_key \
            -Pandroid.injected.signing.store.password="${{ secrets.SIGN_KEY_STORE_PASSWD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.SIGN_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.SIGN_KEY_ALIAS_PASSWD }}" \
            --stacktrace

      - name: Verify APK signature
        run: |
          echo "APK build completed. Files in output directory:"
          find app/build/outputs/apk/release -name "*.apk" -type f -exec ls -lh {} \;

      - name: Clean up keystore
        if: always()
        run: rm -f sign_key

      - name: Generate release tag
        id: tag
        run: |
          # push tag 触发：直接使用推送的 v* tag；手动触发：生成动态日期标签
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=release-$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
          fi

      - name: Validate and prepare release tag
        run: |
          tag="${{ steps.tag.outputs.tag_name }}"
          # 检查tag是否包含无效字符
          if [[ ! "$tag" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "Error: tag_name contains invalid characters. Use only alphanumeric, dots, hyphens, and underscores."
            exit 1
          fi
          echo "TAG_NAME=$tag" >> $GITHUB_ENV

      - name: Check if tag exists and create/update release
        run: |
          # 生成两个 tag 之间的更新内容：push tag 触发时 HEAD 即当前 tag，取 HEAD 父提交的最近 tag 作基准；
          # 手动触发（动态 tag 尚未打上）时，用 HEAD 最近的一个已存在 tag 作基准
          if [ "${{ github.event_name }}" == "push" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          else
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")
          fi
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline --no-merges "$PREV_TAG..HEAD")
          else
            COMMITS=$(git log --oneline --no-merges)
          fi

          # 转换为 Markdown 列表
          if [ -n "$COMMITS" ]; then
            COMMITS_MD=$(echo "$COMMITS" | sed 's/^/- /')
          else
            COMMITS_MD="- 暂无提交记录"
          fi

          NOTES="## 版本说明
          
          下载安装即可使用
          
          ### APK 文件
          - 通用 APK 支持所有架构
          - 也提供针对特定架构的 APK，以减小下载体积
          
          ### 更新日志
          $COMMITS_MD"
          
          # 检查标签是否已存在
          if gh release view ${{ env.TAG_NAME }} --json tagName > /dev/null 2>&1; then
            if [[ "${{ github.event.inputs.update_existing }}" == "true" ]]; then
              echo "Tag ${{ env.TAG_NAME }} already exists, updating release..."
              gh release edit ${{ env.TAG_NAME }} \
                --title "${{ github.event.inputs.release_title || format('Release {0}', env.TAG_NAME) }}" \
                --notes "$NOTES" \
                --draft=false \
                --prerelease=false
            else
              echo "Error: Tag ${{ env.TAG_NAME }} already exists and update_existing is false."
              exit 1
            fi
          else
            echo "Tag ${{ env.TAG_NAME }} does not exist, creating new release..."
            gh release create ${{ env.TAG_NAME }} \
              --title "${{ github.event.inputs.release_title || format('Release {0}', env.TAG_NAME) }}" \
              --notes "$NOTES" \
              --draft=false \
              --prerelease=false
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APKs to Release
        run: |
          assets_dir="app/build/outputs/apk/release"
          
          for apk in "$assets_dir"/*.apk; do
            if [ -f "$apk" ]; then
              echo "Uploading $(basename "$apk")..."
              gh release upload "${{ env.TAG_NAME }}" "$apk" --clobber
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}