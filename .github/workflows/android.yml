name: Android CI

on:
  push:
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/android.yml'

jobs:
  # 先行检查：commit 是否已打 tag → 已打则跳过构建（避免与 Release Build 重复）
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 默认浅克隆不拉取 tags, 会导致 git tag --points-at 永远为空
          fetch-tags: true
      - id: check
        run: |
          if [ -n "$(git tag --points-at HEAD)" ]; then
            echo "should-run=false" >> "$GITHUB_OUTPUT"
            echo "Commit is tagged, skipping CI build"
          else
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-tag
    if: needs.check-tag.outputs.should-run == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Create keystore file
      run: |
        echo "${{ secrets.SIGN_KEY_STORE_B64 }}" | base64 -d > sign_key
        ls -lh sign_key
        file sign_key
      
    - name: Build Release APK
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$(pwd)/sign_key \
          -Pandroid.injected.signing.store.password="${{ secrets.SIGN_KEY_STORE_PASSWD }}" \
          -Pandroid.injected.signing.key.alias="${{ secrets.SIGN_KEY_ALIAS }}" \
          -Pandroid.injected.signing.key.password="${{ secrets.SIGN_KEY_ALIAS_PASSWD }}" \
          --stacktrace

    - name: Verify APK signature
      run: |
        echo "APK build completed. Files in output directory:"
        find app/build/outputs/apk/release -name "*.apk" -type f -exec ls -lh {} \;

    - name: Clean up keystore
      if: always()
      run: rm -f sign_key

    - name: Resolve artifact name
      id: artifact
      run: |
        # 从构建产物元数据读取完整版本名，再剥离尾部的 .<提交数量>.<hash> 得到基础版本名
        VERSION_NAME=$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)
        BASE_VERSION_NAME=$(echo "$VERSION_NAME" | sed -E 's/\.[^.]+\.[^.]+$//')
        HASH=$(git rev-parse --short=7 HEAD)
        echo "name=CodeScan-${BASE_VERSION_NAME}-${HASH}" >> "$GITHUB_OUTPUT"

    - name: Upload Release APK as artifact
      uses: actions/upload-artifact@v7
      with:
        # 产物名：CodeScan-<基础版本名>-<7位短hash>，例如 CodeScan-4.8-6eb934b
        name: ${{ steps.artifact.outputs.name }}
        # 上传 release 输出目录下的全部产物：APK、baselineProfiles 文件夹、output-metadata.json
        path: app/build/outputs/apk/release/
        if-no-files-found: error
        retention-days: 90
